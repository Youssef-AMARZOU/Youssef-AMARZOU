name: Update README with Recent Activity

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with Recent Activity
        uses: jamesives/github-profile-readme-activity@v4.0.3
        with:
          README_FILE: README.md
          BLOCK_TAG: 'ACTIVITY_BLOCK'
          ACTIVITY_COUNT: 5
          COMMIT_MESSAGE: 'Update README with recent activity'
          SHOW_PROFILE_LINK: true
          SHOW_ICONS: true
          FILTER_AUTHORS: true
