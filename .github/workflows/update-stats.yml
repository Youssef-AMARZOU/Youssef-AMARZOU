name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate GitHub Stats
        run: |
          echo "Stats will be auto-generated by the API endpoints in README.md"
          echo "The following dynamic elements are included:"
          echo "- github-readme-stats.vercel.app (auto-updates on each load)"
          echo "- github-readme-streak-stats.herokuapp.com (auto-updates on each load)"
          echo "- github-readme-activity-graph.vercel.app (auto-updates on each load)"
          echo "- ghchart.rshah.org (auto-updates on each load)"
          echo "- github-profile-trophy.vercel.app (auto-updates on each load)"
